<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>GiphyAPI Random Gif</title>
    <script defer src="./script.js"></script>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="gif-container">
      <p class="error-message"></p>
      <label id="search-label" for="search-input" autocomplete="off">
        Enter Gif you want to see:
      </label>
      <input type="text" id="search-input" name="search" />
      <button id="search-button">Search</button>
      <img id="gif-image" src="#" />
      <button class="random-button">Random Gif</button>
    </div>
  </body>
</html>
